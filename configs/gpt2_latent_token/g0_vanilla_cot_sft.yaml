experiment: G0
description: Vanilla pure-text CoT SFT baseline with no latent token path.
model:
  family: gpt2
  name_or_path: /data/zxl/models/openai-community-gpt2
method:
  has_model_b: false
  projector: false
  role_embedding: false
  cumulative_latent: false
  loss2: false
loss:
  main: true
  self_decode: false
  latent_token: false
  lambda_self: 0.0
  lambda_latent: 0.0
data:
  format: {question: string, cot: string, answer: string}
  seed: 42
  train_samples: 10000
  eval_samples: 1000
