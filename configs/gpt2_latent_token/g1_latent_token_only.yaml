experiment: G1
description: Latent token supervision only; shared GPT2 predicts <THINK> and answer.
model:
  family: gpt2
  name_or_path: /data/zxl/models/openai-community-gpt2
  special_tokens: {think: <THINK>}
method:
  has_model_b: false
  projector: false
  role_embedding: false
  cumulative_latent: false
  loss2: false
loss:
  main: true
  self_decode: false
  latent_token: true
  lambda_self: 0.0
  lambda_latent: 0.05
trainability:
  require_embed_tokens_trainable: true
  require_lm_head_trainable: true
